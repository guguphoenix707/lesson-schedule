<g id="a1:22" transform="translate(40, 764.9995)"><text font-size="17" font-family="Noto Sans SC" font-weight="normal" fill="#475569" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="20.001"><tspan x="0" text-anchor="start">remaining_units = 该账户有效流水的代数和；试听和取消课次不产生正式课时扣减。</tspan></tspan></text></g>
<g id="a1:23" transform="translate(40, 793.9995)"><text font-size="17" font-family="Noto Sans SC" font-weight="normal" fill="#475569" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="20.001"><tspan x="0" text-anchor="start">退款或误扣纠错另记流水，不删除原流水。课时账本属后续实现，本期只明确关系。</tspan></tspan></text></g>
