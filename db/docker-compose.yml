services:
  postgres:
    image: postgres:16-alpine
    container_name: class-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: class
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./:/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d class"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
